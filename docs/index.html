<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Top 200</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#14181f;--muted:#5f6b7a;--line:#e3e7ec;
  --accent:#2457d6;--pos:#14834a;--neg:#c23b30;--warn:#b26b00;--chip:#eef2f8;
  --c1:#2457d6;--c2:#e08a00;--c3:#8a94a3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1217;--panel:#171b22;--ink:#e8ebf0;--muted:#9aa5b4;--line:#2a313b;
  --accent:#6f9bff;--pos:#3fbf7f;--neg:#ff6b5e;--warn:#f0a83a;--chip:#222934;
  --c1:#6f9bff;--c2:#f0a83a;--c3:#6b7584;
}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 24px 0;max-width:1280px;margin:auto}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
main{max-width:1280px;margin:auto;padding:20px 24px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tk{font-weight:700;font-size:15px}
.nm{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.big{font-size:20px;font-weight:650}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:2px 4px 2px 0}
.chip.pos{color:var(--pos)}.chip.neg{color:var(--neg)}.chip.warn{color:var(--warn)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;margin-top:6px}
.kv b{display:block;font-size:13px;color:var(--ink)}.kv span{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-left:6px;opacity:.75}
.tablewrap{overflow:auto;max-height:70vh}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}
ul{margin:6px 0 0;padding-left:18px}li{margin:3px 0}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:880px;width:94vw;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dbody{padding:14px 18px 20px}
.x{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer}
.legend{font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 10px}
.empty{color:var(--muted);padding:30px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.kpi span{color:var(--muted);font-size:12px;display:block}.kpi b{font-size:24px;font-weight:650;display:block;margin-top:2px}.kpi small{color:var(--muted);font-size:12px}
.disc{color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>Agente Top 200</h1>
  <div class="sub" id="meta">Cargando…</div>
  <nav>
    <button data-t="hoy" class="on">Semana · entrada (20)</button>
    <button data-t="semana">Mes · tesis (50)</button>
    <button data-t="universo">Universo (200)</button>
    <button data-t="historial">Historial</button>
    <button data-t="costos">Costos</button>
    <button data-t="como">Cómo funciona</button>
  </nav>
</header>
<main>
  <section id="t-hoy"></section>
  <section id="t-semana" hidden></section>
  <section id="t-universo" hidden></section>
  <section id="t-historial" hidden></section>
  <section id="t-costos" hidden></section>
  <section id="t-como" hidden></section>
  <p class="disc">Herramienta de análisis personal. No es asesoramiento financiero. Datos de Yahoo Finance y companiesmarketcap.com; pueden tener errores o demoras.</p>
</main>
<dialog id="dlg"><div class="dhead"><div id="dtitle"></div><button class="x" onclick="dlg.close()">×</button></div><div class="dbody" id="dbody"></div></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(v,d=1)=>v==null?"–":(v*100).toFixed(d)+"%";
const spct=(v,d=1)=>v==null?"–":`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":""}${(v*100).toFixed(d)}%</span>`;
const n=(v,d=1)=>v==null?"–":Number(v).toLocaleString("es-AR",{maximumFractionDigits:d,minimumFractionDigits:d});
const money=v=>v==null?"–":v>=1e12?"US$ "+n(v/1e12,2)+" T":v>=1e9?"US$ "+n(v/1e9,0)+" B":"US$ "+n(v/1e6,0)+" M";
const fecha=s=>s?new Date(s).toLocaleString("es-AR",{dateStyle:"medium",timeStyle:"short"}):"–";
// S = mensual (50 con tesis) · D = semanal (20 con técnico) · R = rotación
let U=null,S=null,D=null,R=null,H=null,C=null,SER={};

async function load(f){try{const r=await fetch("data/"+f+"?v="+Date.now());return r.ok?r.json():null}catch(e){return null}}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!=="t-"+b.dataset.t);
});

function spark(t,w=260,h=64,full=false){
  const s=SER[t];if(!s)return"";
  const all=[...s.close,...s.sma50,...s.sma200].filter(v=>v!=null);
  const lo=Math.min(...all),hi=Math.max(...all),N=s.close.length;
  const pad=full?28:2;
  const X=i=>pad+i*(w-pad-2)/(N-1),Y=v=>2+(h-4-(full?16:0))*(1-(v-lo)/((hi-lo)||1));
  const path=a=>{let d="",m=false;a.forEach((v,i)=>{if(v==null){m=false;return}d+=(m?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);m=true});return d};
  let ax="";
  if(full){[lo,(lo+hi)/2,hi].forEach(v=>ax+=`<text x="0" y="${Y(v)+4}" font-size="10" fill="var(--muted)">${n(v,0)}</text><line x1="${pad}" x2="${w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`);
    [0,Math.floor(N/2),N-1].forEach(i=>ax+=`<text x="${X(i)}" y="${h-2}" font-size="10" fill="var(--muted)" text-anchor="${i==0?"start":i==N-1?"end":"middle"}">${s.fechas[i]}</text>`)}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Precio de ${esc(t)}">${ax}
   <path d="${path(s.sma200)}" fill="none" stroke="var(--c3)" stroke-width="1.2" stroke-dasharray="3 3"/>
   <path d="${path(s.sma50)}" fill="none" stroke="var(--c2)" stroke-width="1.2"/>
   <path d="${path(s.close)}" fill="none" stroke="var(--c1)" stroke-width="1.8"/></svg>`;
}
const legend=`<div class="legend"><i style="background:var(--c1)"></i>Precio<i style="background:var(--c2)"></i>SMA50<i style="background:var(--c3)"></i>SMA200 · últimos ~9 meses</div>`;

function chipEtiqueta(e){const c=/compra|sana/i.test(e)?"pos":/Debilidad|cautela/i.test(e)?"neg":/esperar/i.test(e)?"warn":"";return `<span class="chip ${c}">${esc(e)}</span>`}
function chipVer(v){if(!v)return"";const c=/Candidata/.test(v)?"pos":/No encaja/.test(v)?"neg":"warn";return `<span class="chip ${c}">${esc(v)}</span>`}

const ORD_MOM={"Entrar ahora":0,"Entrar de a poco":1,"Esperar":2,"Evitar":3};
function chipMom(m){if(!m)return"";const c=/ahora/.test(m)?"pos":/a poco/.test(m)?"pos":/Evitar/.test(m)?"neg":"warn";return `<span class="chip ${c}" style="font-weight:600">${esc(m)}</span>`}
function renderHoy(){
  const el=$("#t-hoy");
  if(!D){el.innerHTML=`<div class="empty">Todavía no hay análisis semanal.</div>`;return}
  const r=D.resumen_ia,pe=r?.por_empresa||{};let h="";
  const cob=D.cobertura_mes;
  h+=`<div class="panel"><h2>${esc(r?.titular||"Análisis de la semana")}</h2>${r?.resumen?`<div>${esc(r.resumen)}</div>`:""}
    ${cob?`<div class="mut" style="margin-top:8px">Ciclo del mes: ${cob.analizadas} de ${cob.total} empresas ya analizadas. Cada semana entran las que hace más tiempo que no se revisan, más hasta 5 en seguimiento.</div>`:""}</div>`;
  const emp=[...D.empresas].sort((a,b)=>((ORD_MOM[pe[a.ticker]?.momento]??9)-(ORD_MOM[pe[b.ticker]?.momento]??9))||(b.puntaje_tecnico-a.puntaje_tecnico));
  h+=`<div class="row" style="margin:4px 0 10px"><div class="mut">Ordenadas por momento de entrada y puntaje técnico (−100 a +100)</div>${legend}</div><div class="grid">`;
  for(const e of emp){const w=pe[e.ticker];
    h+=`<div class="card" onclick="detalle('${esc(e.ticker)}')">
      <div class="row"><div><span class="tk">${esc(e.ticker)}</span> <span class="nm">${esc(e.nombre)}</span></div>
      <div class="big ${e.puntaje_tecnico>=0?"pos":"neg"}">${e.puntaje_tecnico>0?"+":""}${e.puntaje_tecnico}</div></div>
      <div>${chipMom(w?.momento)}${/Seguimiento/.test(e.motivo||"")?`<span class="chip warn">Seguimiento</span>`:/Primera/.test(e.motivo||"")?`<span class="chip">Nueva</span>`:""}</div>
      ${spark(e.ticker)}
      <div>${chipEtiqueta(e.etiqueta)}${e.cruce?`<span class="chip warn">${esc(e.cruce)}</span>`:""}</div>
      <div class="kv"><div><span>Precio</span><b>${n(e.precio,2)}</b></div><div><span>Semana</span><b>${spct(e.rend_1s)}</b></div><div><span>RSI</span><b>${n(e.rsi,0)}</b></div>
      <div><span>1 mes</span><b>${spct(e.rend_1m)}</b></div><div><span>Desde máx.</span><b>${spct(e.dist_max52)}</b></div><div><span>Fund.</span><b>${n(e.score_fundamental,0)}</b></div></div>
      ${w?.comentario?`<div style="font-size:12px;margin-top:6px">${esc(w.comentario)}</div>`:""}
      ${w?.nivel?`<div class="mut" style="font-size:12px;margin-top:4px">A vigilar: ${esc(w.nivel)}</div>`:""}
    </div>`;
  }
  el.innerHTML=h+"</div>";
}

let sortS={k:"puesto",asc:true},filtroS={sector:"",ver:"",op:""};
function renderSemana(){
  const el=$("#t-semana");
  if(!S){el.innerHTML=`<div class="empty">Todavía no hay análisis mensual.</div>`;return}
  const sectores=[...new Set(S.empresas.map(e=>e.sector))].sort();
  let rows=S.empresas.filter(e=>(!filtroS.sector||e.sector===filtroS.sector)&&(!filtroS.ver||(e.ia&&e.ia.veredicto===filtroS.ver))&&(!filtroS.op||String(e.operable)===filtroS.op));
  const k=sortS.k;rows.sort((a,b)=>{const x=a[k]??-1e9,y=b[k]??-1e9;return (x>y?1:x<y?-1:0)*(sortS.asc?1:-1)});
  const th=(k,t,c="")=>`<th class="${c}" onclick="ordS('${k}')">${t}${sortS.k===k?(sortS.asc?" ▲":" ▼"):""}</th>`;
  let h=`<div class="panel"><div class="filters">
   <select onchange="filtroS.sector=this.value;renderSemana()"><option value="">Todos los sectores</option>${sectores.map(s=>`<option ${s===filtroS.sector?"selected":""}>${esc(s)}</option>`).join("")}</select>
   <select onchange="filtroS.ver=this.value;renderSemana()"><option value="">Todos los veredictos</option>${["Candidata para el satélite","Seguir de cerca","No encaja"].map(s=>`<option ${s===filtroS.ver?"selected":""}>${s}</option>`).join("")}</select>
   <select onchange="filtroS.op=this.value;renderSemana()"><option value="">Todas</option><option value="true" ${filtroS.op==="true"?"selected":""}>Comprables desde EE.UU.</option><option value="false" ${filtroS.op==="false"?"selected":""}>Solo mercados locales</option></select>
   <span class="mut" style="align-self:center">${rows.length} empresas · ★ = analizada esta semana</span></div>
   <div class="tablewrap"><table><thead><tr>${th("puesto","#","n")}${th("ticker","Ticker")}<th>Empresa</th>${th("sector","Sector")}${th("score","Score","n")}${th("score_calidad","Calidad","n")}${th("score_valor","Valor","n")}${th("roic","ROIC","n")}${th("fcf_yield","FCF yield","n")}${th("pe_forward","PE fwd","n")}<th>Veredicto IA</th><th>Último técnico</th><th>Alertas</th></tr></thead><tbody>`;
  for(const e of rows){
    h+=`<tr onclick="detalle('${esc(e.ticker)}')"><td class="n">${e.puesto}</td><td><b>${esc(e.ticker)}</b>${D?.empresas.some(x=>x.ticker===e.ticker)?" ★":""}</td><td class="nm" style="max-width:220px">${esc(e.nombre)}</td><td>${esc(e.sector)}</td>
    <td class="n"><b>${n(e.score,0)}</b><span class="bar" style="width:${(e.score||0)*0.5}px"></span></td><td class="n">${n(e.score_calidad,0)}</td><td class="n">${n(e.score_valor,0)}</td>
    <td class="n">${pct(e.roic)}</td><td class="n">${pct(e.fcf_yield)}</td><td class="n">${n(e.pe_forward,1)}</td><td>${chipVer(e.ia&&e.ia.veredicto)}</td><td class="mut">${R?.historial?.[e.ticker]?.ultima||"–"}</td><td>${(e.alertas||[]).map(a=>`<span class="chip neg">${esc(a)}</span>`).join("")}</td></tr>`;
  }
  el.innerHTML=h+"</tbody></table></div></div>";
}
function ordS(k){sortS={k,asc:sortS.k===k?!sortS.asc:(k==="puesto"||k==="ticker"||k==="sector"||k==="pe_forward")};renderSemana()}

let sortU={k:"rank",asc:true},qU="";
function renderUniverso(){
  const el=$("#t-universo");
  if(!U){el.innerHTML=`<div class="empty">Todavía no hay universo.</div>`;return}
  const sc={};(S?.ranking_completo||[]).forEach(r=>sc[r.ticker]=r);
  let rows=U.empresas.map(e=>({...e,...(sc[e.ticker]||{}),rank:e.rank}));
  if(qU)rows=rows.filter(e=>(e.ticker+" "+(e.nombre||"")+" "+(e.sector||"")).toLowerCase().includes(qU.toLowerCase()));
  const k=sortU.k;rows.sort((a,b)=>{const x=a[k]??-1e18,y=b[k]??-1e18;return (x>y?1:x<y?-1:0)*(sortU.asc?1:-1)});
  const th=(k,t,c="")=>`<th class="${c}" onclick="ordU('${k}')">${t}${sortU.k===k?(sortU.asc?" ▲":" ▼"):""}</th>`;
  let h=`<div class="panel"><div class="filters"><input placeholder="Buscar ticker, nombre o sector" value="${esc(qU)}" oninput="qU=this.value;renderUniverso()" style="min-width:260px">
  <span class="mut" style="align-self:center">${U.cantidad} empresas · ${U.operables} comprables desde EE.UU. · actualizado ${fecha(U.actualizado)}</span></div>
  ${U.entraron?.length?`<div style="margin-bottom:8px">Entraron este mes: ${U.entraron.map(t=>`<span class="chip pos">${esc(t)}</span>`).join("")}</div>`:""}
  ${U.salieron?.length?`<div style="margin-bottom:8px">Salieron: ${U.salieron.map(t=>`<span class="chip neg">${esc(t)}</span>`).join("")}</div>`:""}
  <div class="tablewrap"><table><thead><tr>${th("rank","#","n")}${th("ticker","Ticker")}<th>Empresa</th>${th("sector","Sector")}${th("market_cap","Capitalización","n")}${th("score","Score mensual","n")}${th("operable","EE.UU.")}</tr></thead><tbody>`;
  for(const e of rows)h+=`<tr onclick="detalle('${esc(e.ticker)}')"><td class="n">${e.rank??"+"}</td><td><b>${esc(e.ticker)}</b></td><td class="nm" style="max-width:260px">${esc(e.nombre)}</td><td>${esc(e.sector||"")}</td><td class="n">${money(e.market_cap)}</td><td class="n">${n(e.score,0)}</td><td>${e.operable?"Sí":"<span class='mut'>No</span>"}</td></tr>`;
  el.innerHTML=h+"</tbody></table></div></div>";
}
function ordU(k){sortU={k,asc:sortU.k===k?!sortU.asc:(k==="rank"||k==="ticker"||k==="sector")};renderUniverso()}

function detalle(t){
  const f=S?.empresas.find(e=>e.ticker===t),d=D?.empresas.find(e=>e.ticker===t),u=U?.empresas.find(e=>e.ticker===t),r=S?.ranking_completo?.find(e=>e.ticker===t);
  $("#dtitle").innerHTML=`<span class="tk">${esc(t)}</span> <span class="mut">${esc(f?.nombre||d?.nombre||u?.nombre||"")}</span>`;
  let h="";
  if(d){const w=D.resumen_ia?.por_empresa?.[t];
    if(w)h+=`<div class="panel">${chipMom(w.momento)}<span class="chip">${esc(d.motivo||"")}</span><p>${esc(w.comentario)}</p>${w.nivel?`<div class="mut">A vigilar: ${esc(w.nivel)}</div>`:""}</div>`;
    h+=`<h3>Técnico de la semana</h3>${spark(t,820,220,true)}${legend}
    <div>${chipEtiqueta(d.etiqueta)}<span class="chip">Tendencia: ${esc(d.tendencia)}</span><span class="chip">Puntaje ${d.puntaje_tecnico}</span></div>
    <div class="kv"><div><span>Precio</span><b>${n(d.precio,2)}</b></div><div><span>SMA50 / SMA200</span><b>${n(d.sma50,1)} / ${n(d.sma200,1)}</b></div><div><span>RSI 14</span><b>${n(d.rsi,0)}</b></div>
    <div><span>MACD hist.</span><b>${n(d.macd_hist,2)}</b></div><div><span>Bollinger %B</span><b>${n(d.bb_pct,2)}</b></div><div><span>Volatilidad (ATR)</span><b>${pct(d.atr_pct)}</b></div>
    <div><span>1 semana</span><b>${spct(d.rend_1s)}</b></div><div><span>3 meses</span><b>${spct(d.rend_3m)}</b></div><div><span>En el año</span><b>${spct(d.rend_ytd)}</b></div>
    <div><span>Desde máx. 52s</span><b>${spct(d.dist_max52)}</b></div><div><span>Desde mín. 52s</span><b>${spct(d.dist_min52)}</b></div><div><span>Volumen vs prom.</span><b>${n(d.vol_rel,2)}x</b></div></div>
    <div class="mut" style="font-size:12px;margin-top:6px">${(d.motivos||[]).map(esc).join(" · ")}</div>`}
  if(f){const ia=f.ia;
    h+=`<h3>Tesis del mes · puesto ${f.puesto} de ${S.empresas.length}</h3>
    <div><span class="chip">Score ${n(f.score,0)}</span><span class="chip">Calidad ${n(f.score_calidad,0)}</span><span class="chip">Valor ${n(f.score_valor,0)}</span><span class="chip">${esc(f.sector)}</span>${f.operable?`<span class="chip pos">Comprable desde EE.UU.</span>`:`<span class="chip warn">Solo mercado local</span>`}${(f.alertas||[]).map(a=>`<span class="chip neg">${esc(a)}</span>`).join("")}</div>`;
    if(ia){const L=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
      h+=`<div class="panel" style="margin-top:10px">${chipVer(ia.veredicto)}<span class="chip">Calidad: ${esc(ia.calidad)}</span><span class="chip">Valuación: ${esc(ia.valuacion)}</span><span class="chip">Confianza ${esc(ia.confianza)}/5</span>
      <p><b>${esc(ia.resumen)}</b></p><p>${esc(ia.tesis)}</p>
      <div class="two"><div><h3>Fortalezas</h3><ul>${L(ia.fortalezas)}</ul></div><div><h3>Riesgos</h3><ul>${L(ia.riesgos)}</ul></div></div>
      <h3>Catalizadores</h3><ul>${L(ia.catalizadores)}</ul><h3>Qué vigilar</h3><div>${esc(ia.que_vigilar)}</div></div>`}
    h+=`<div class="kv" style="grid-template-columns:repeat(4,1fr)">
      <div><span>ROIC</span><b>${pct(f.roic)}</b></div><div><span>ROE</span><b>${pct(f.roe)}</b></div><div><span>Margen bruto</span><b>${pct(f.margen_bruto)}</b></div><div><span>Margen operativo</span><b>${pct(f.margen_operativo)}</b></div>
      <div><span>FCF yield</span><b>${pct(f.fcf_yield)}</b></div><div><span>PE forward</span><b>${n(f.pe_forward)}</b></div><div><span>EV/EBITDA</span><b>${n(f.ev_ebitda)}</b></div><div><span>PEG</span><b>${n(f.peg,2)}</b></div>
      <div><span>Deuda neta/EBITDA</span><b>${n(f.deuda_neta_ebitda,2)}</b></div><div><span>Crec. ventas</span><b>${pct(f.crecimiento_ventas)}</b></div><div><span>Años FCF +</span><b>${f.fcf_consistencia==null?"–":pct(f.fcf_consistencia,0)}</b></div><div><span>Upside analistas</span><b>${spct(f.upside_analistas)}</b></div>
      <div><span>Capitalización</span><b>${money(f.market_cap)}</b></div><div><span>Dividendo</span><b>${f.dividend_yield==null?"–":n(f.dividend_yield,2)+"%"}</b></div><div><span>Beta</span><b>${n(f.beta,2)}</b></div><div><span>Consenso</span><b>${esc(f.recomendacion||"–")}</b></div></div>
      ${f.noticias?.length?`<h3>Titulares considerados</h3><ul>${f.noticias.map(x=>`<li class="mut">${esc(x)}</li>`).join("")}</ul>`:""}`;
  }else if(r){h+=`<h3>Score mensual</h3><div><span class="chip">Score ${n(r.score,0)}</span><span class="chip">Calidad ${n(r.score_calidad,0)}</span><span class="chip">Valor ${n(r.score_valor,0)}</span></div><p class="mut">No quedó entre las ${S.empresas.length} mejores este mes, por eso no tiene tesis.</p>`}
  else h+=`<p class="mut">Sin datos fundamentales esta semana.</p>`;
  $("#dbody").innerHTML=h;$("#dlg").showModal();
}


// ---------------- HISTORIAL ----------------
let hTicker="",hFiltro={fecha:"",tipo:"",senal:""},hSort={k:"fecha",asc:false};
const senal=e=>e.tipo==="mensual"?e.veredicto:e.momento||e.etiqueta;
function colSenal(v){return !v?"var(--c3)":/Candidata|Entrar|compra|sana/.test(v)?"var(--pos)":/No encaja|Evitar|Debilidad/.test(v)?"var(--neg)":"var(--warn)"}
function chartHist(t){
  const s=H.series[t],ref=H.series[H.referencia];if(!s)return`<p class="mut">Sin precios para ${esc(t)}.</p>`;
  const ev=H.evaluaciones.filter(e=>e.ticker===t).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const f0=ev[0].fecha,i0=Math.max(0,s.fechas.findIndex(d=>d>=f0)-1);
  const F=s.fechas.slice(i0),C=s.close.slice(i0);
  let RB=null;if(ref){const m=new Map(ref.fechas.map((d,i)=>[d,ref.close[i]]));const r0=m.get(F[0]);if(r0)RB=F.map(d=>m.has(d)?m.get(d)/r0*C[0]:null)}
  const W=820,Hh=240,pl=44,pb=20,all=[...C,...(RB||[])].filter(v=>v!=null),lo=Math.min(...all),hi=Math.max(...all);
  const X=i=>pl+i*(W-pl-6)/Math.max(1,F.length-1),Y=v=>6+(Hh-pb-10)*(1-(v-lo)/((hi-lo)||1));
  const path=a=>{let d="",m=false;a.forEach((v,i)=>{if(v==null){m=false;return}d+=(m?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);m=true});return d};
  let g="";[lo,(lo+hi)/2,hi].forEach(v=>g+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="0" y="${Y(v)+4}" font-size="10" fill="var(--muted)">${n(v,0)}</text>`);
  [0,Math.floor((F.length-1)/2),F.length-1].forEach(i=>g+=`<text x="${X(i)}" y="${Hh-4}" font-size="10" fill="var(--muted)" text-anchor="${i==0?"start":i==F.length-1?"end":"middle"}">${F[i]}</text>`);
  let mk="";for(const e of ev){let i=F.findIndex(d=>d>=e.fecha);if(i<0)i=F.length-1;const v=C[i];
    const sh=e.tipo==="mensual"?`<rect x="${X(i)-5}" y="${Y(v)-5}" width="10" height="10" transform="rotate(45 ${X(i)} ${Y(v)})"`:`<circle cx="${X(i)}" cy="${Y(v)}" r="5"`;
    mk+=`${sh} fill="${colSenal(senal(e))}" stroke="var(--panel)" stroke-width="1.5"><title>${e.fecha} · ${e.tipo} · ${esc(senal(e)||"")}</title>${e.tipo==="mensual"?"</rect>":"</circle>"}`}
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" role="img" aria-label="Historial de ${esc(t)}">${g}
    ${RB?`<path d="${path(RB)}" fill="none" stroke="var(--c3)" stroke-width="1.3" stroke-dasharray="4 3"/>`:""}
    <path d="${path(C)}" fill="none" stroke="var(--c1)" stroke-width="2"/>${mk}</svg>
    <div class="legend"><i style="background:var(--c1)"></i>${esc(t)} (semanal)${RB?`<i style="background:var(--c3)"></i>${esc(H.referencia)} llevado al mismo punto de partida`:""} · ◆ tesis mensual · ● análisis semanal (verde = a favor, ámbar = esperar/seguir, rojo = en contra)</div>`;
}
function tablaSenales(arr,titulo){
  if(!arr?.length)return `<div><h3>${titulo}</h3><p class="mut">Todavía no hay evaluaciones con al menos ${H.dias_minimos} días de antigüedad.</p></div>`;
  return `<div><h3>${titulo}</h3><table><thead><tr><th>Señal</th><th class="n">Casos</th><th class="n">Rend. prom.</th><th class="n">${esc(H.referencia)} mismo período</th><th class="n">Diferencia</th><th class="n">Le ganó</th></tr></thead><tbody>
  ${arr.map(g=>`<tr style="cursor:default"><td>${esc(g.grupo)}</td><td class="n">${g.n}</td><td class="n">${spct(g.rend_prom)}</td><td class="n">${spct(g.ref_prom)}</td><td class="n"><b>${spct(g.exceso_prom)}</b></td><td class="n">${pct(g.le_gano_pct,0)}</td></tr>`).join("")}</tbody></table></div>`;
}
function renderHistorial(){
  const el=$("#t-historial");
  if(!H||!H.evaluaciones?.length){el.innerHTML=`<div class="empty">Todavía no hay historial. Se arma solo con cada ejecución.</div>`;return}
  const ev=H.evaluaciones;
  const tick=[...new Set(ev.map(e=>e.ticker))].sort();
  if(!hTicker)hTicker=(D?.empresas?.[0]?.ticker)||tick[0];
  const nombre=t=>ev.find(e=>e.ticker===t)?.nombre||t;
  let h=`<div class="panel"><h2>¿Funcionan las señales?</h2>
   <div class="mut" style="margin-bottom:6px">Rendimiento promedio de las acciones desde la fecha en que se analizaron, comparado con ${esc(H.referencia)} en el mismo período. Cuantos más meses de historial, más confiable la lectura.</div>
   <div class="two">${tablaSenales(H.senales.veredicto,"Por veredicto de la tesis mensual")}${tablaSenales(H.senales.momento,"Por momento de entrada semanal")}</div></div>`;
  const evT=ev.filter(e=>e.ticker===hTicker).sort((a,b)=>a.fecha<b.fecha?-1:1);
  h+=`<div class="panel"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Seguimiento por empresa</h2>
   <select onchange="hTicker=this.value;renderHistorial()">${tick.map(t=>`<option value="${esc(t)}" ${t===hTicker?"selected":""}>${esc(t)} · ${esc(nombre(t))}</option>`).join("")}</select></div>
   ${chartHist(hTicker)}
   <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Señal</th><th class="n">Score</th><th class="n">Técnico</th><th class="n">Precio entonces</th><th class="n">Desde entonces</th><th class="n">vs ${esc(H.referencia)}</th><th>Comentario</th></tr></thead><tbody>
   ${evT.map(e=>`<tr style="cursor:default"><td>${e.fecha}</td><td>${e.tipo==="mensual"?"Tesis mensual":"Semanal"}</td><td>${e.tipo==="mensual"?chipVer(e.veredicto):chipMom(e.momento)||chipEtiqueta(e.etiqueta||"")}</td>
     <td class="n">${n(e.score,0)}</td><td class="n">${e.puntaje_tecnico??"–"}</td><td class="n">${n(e.precio_eval,2)}</td><td class="n">${e.dias<1?"–":spct(e.rend)}</td><td class="n">${e.dias<1?"–":spct(e.exceso)}</td>
     <td style="white-space:normal;min-width:260px;font-size:12px" class="mut">${esc(e.resumen||e.comentario||"")}</td></tr>`).join("")}</tbody></table></div></div>`;
  // Tabla general
  let rows=ev.filter(e=>(!hFiltro.fecha||e.fecha===hFiltro.fecha)&&(!hFiltro.tipo||e.tipo===hFiltro.tipo)&&(!hFiltro.senal||senal(e)===hFiltro.senal));
  const k=hSort.k;rows=[...rows].sort((a,b)=>{const x=a[k]??-1e9,y=b[k]??-1e9;return (x>y?1:x<y?-1:0)*(hSort.asc?1:-1)});
  const senales=[...new Set(ev.map(senal).filter(Boolean))].sort();
  const th=(k,t,c="")=>`<th class="${c}" onclick="hSort={k:'${k}',asc:hSort.k==='${k}'?!hSort.asc:false};renderHistorial()">${t}${hSort.k===k?(hSort.asc?" ▲":" ▼"):""}</th>`;
  h+=`<div class="panel"><h2>Todas las evaluaciones</h2><div class="filters">
   <select onchange="hFiltro.fecha=this.value;renderHistorial()"><option value="">Todas las fechas</option>${[...H.fechas].reverse().map(f=>`<option ${f===hFiltro.fecha?"selected":""}>${f}</option>`).join("")}</select>
   <select onchange="hFiltro.tipo=this.value;renderHistorial()"><option value="">Mensual y semanal</option><option value="mensual" ${hFiltro.tipo==="mensual"?"selected":""}>Tesis mensual</option><option value="semanal" ${hFiltro.tipo==="semanal"?"selected":""}>Semanal</option></select>
   <select onchange="hFiltro.senal=this.value;renderHistorial()"><option value="">Todas las señales</option>${senales.map(x=>`<option ${x===hFiltro.senal?"selected":""}>${esc(x)}</option>`).join("")}</select>
   <span class="mut" style="align-self:center">${rows.length} evaluaciones · tocá una fila para ver la empresa</span></div>
   <div class="tablewrap"><table><thead><tr>${th("fecha","Fecha")}${th("ticker","Ticker")}<th>Tipo</th><th>Señal</th>${th("score","Score","n")}${th("puntaje_tecnico","Técnico","n")}${th("precio_eval","Precio","n")}${th("rend","Desde entonces","n")}${th("exceso","vs "+esc(H.referencia),"n")}</tr></thead><tbody>
   ${rows.map(e=>`<tr onclick="hTicker='${esc(e.ticker)}';renderHistorial();window.scrollTo({top:0,behavior:'smooth'})"><td>${e.fecha}</td><td><b>${esc(e.ticker)}</b></td><td>${e.tipo==="mensual"?"Mensual":"Semanal"}</td><td>${e.tipo==="mensual"?chipVer(e.veredicto):chipMom(e.momento)||chipEtiqueta(e.etiqueta||"")}</td>
     <td class="n">${n(e.score,0)}</td><td class="n">${e.puntaje_tecnico??"–"}</td><td class="n">${n(e.precio_eval,2)}</td><td class="n">${e.dias<1?"–":spct(e.rend)}</td><td class="n">${e.dias<1?"–":spct(e.exceso)}</td></tr>`).join("")}</tbody></table></div>
   <p class="mut" style="font-size:12px">Precios ajustados por dividendos y splits. Las acciones que no cotizan en EE.UU. se miden en su moneda local. Actualizado ${fecha(H.actualizado)}.</p></div>`;
  el.innerHTML=h;
}


// ---------------- COSTOS ----------------
const usd=(v,d=2)=>v==null?"–":"US$ "+Number(v).toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const miles=v=>v==null?"–":Number(v).toLocaleString("es-AR");
function renderCostos(){
  const el=$("#t-costos");
  const regs=(C?.registros||[]).slice().sort((a,b)=>a.fecha<b.fecha?1:-1);
  if(!regs.length){el.innerHTML=`<div class="empty">Todavía no hay ejecuciones registradas.</div>`;return}
  const gastado=regs.reduce((a,r)=>a+(r.costo||0),0),cargado=(C.cargas||[]).reduce((a,c)=>a+(c.monto||0),0);
  const saldo=cargado-gastado,mesAct=new Date().toISOString().slice(0,7);
  const esteMes=regs.filter(r=>r.fecha.slice(0,7)===mesAct).reduce((a,r)=>a+(r.costo||0),0);
  const prom=m=>{const x=regs.filter(r=>r.modo===m&&r.resultado==="ok"&&r.llamadas);return x.length?x.reduce((a,r)=>a+r.costo,0)/x.length:null};
  const pm=prom("mensual")??(prom("todo")!=null?prom("todo")-(prom("semanal")||0.06):null),ps=prom("semanal");
  const proy=pm!=null?pm+(ps??0.06)*4.33:null;
  const alerta=cargado&&saldo<(C.alerta_saldo??1.5);
  let h=`<div class="kpis">
    <div class="kpi" ${alerta?'style="border-color:var(--neg)"':""}><span>Saldo estimado</span><b class="${alerta?"neg":""}">${cargado?usd(saldo):"–"}</b><small>${cargado?`cargado ${usd(cargado)} − gastado ${usd(gastado)}`:"agregá tus cargas en config.yaml"}</small></div>
    <div class="kpi"><span>Gastado en total</span><b>${usd(gastado)}</b><small>${regs.length} ejecuciones registradas</small></div>
    <div class="kpi"><span>Este mes</span><b>${usd(esteMes)}</b><small>${mesAct}</small></div>
    <div class="kpi"><span>Proyección por mes</span><b>${usd(proy)}</b><small>1 mensual + ~4,3 semanales${proy&&cargado?` · alcanza para ~${n(Math.max(0,saldo/proy),1)} meses`:""}</small></div></div>`;
  if(alerta)h+=`<div class="panel" style="border-color:var(--neg)"><b class="neg">Saldo bajo.</b> Cargá crédito en console.anthropic.com y agregá la carga en <code>config.yaml</code> → <code>costos.cargas</code>. Si el saldo llega a cero, el agente sigue funcionando pero sin tesis ni comentarios de IA.</div>`;
  const porMes={};regs.forEach(r=>{const m=r.fecha.slice(0,7);porMes[m]??={n:0,ll:0,c:0};porMes[m].n++;porMes[m].ll+=r.llamadas||0;porMes[m].c+=r.costo||0});
  h+=`<div class="two"><div class="panel"><h2>Por mes</h2><table><thead><tr><th>Mes</th><th class="n">Ejecuciones</th><th class="n">Llamadas IA</th><th class="n">Costo</th></tr></thead><tbody>
    ${Object.keys(porMes).sort().reverse().map(m=>`<tr style="cursor:default"><td>${m}</td><td class="n">${porMes[m].n}</td><td class="n">${miles(porMes[m].ll)}</td><td class="n"><b>${usd(porMes[m].c)}</b></td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><h2>Cargas de crédito</h2>${(C.cargas||[]).length?`<table><thead><tr><th>Fecha</th><th class="n">Monto</th></tr></thead><tbody>${C.cargas.map(c=>`<tr style="cursor:default"><td>${esc(c.fecha)}</td><td class="n">${usd(c.monto)}</td></tr>`).join("")}</tbody></table>`:`<p class="mut">Sin cargas registradas.</p>`}
    <p class="mut" style="font-size:12px">Se editan en <code>config.yaml</code> → <code>costos.cargas</code>.</p></div></div>`;
  h+=`<div class="panel"><h2>Cada ejecución</h2><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Modo</th><th>Origen</th><th>Resultado</th><th class="n">Llamadas</th><th class="n">Tokens entrada</th><th class="n">Tokens salida</th><th class="n">Costo</th><th>Detalle</th></tr></thead><tbody>
    ${regs.map(r=>`<tr style="cursor:default"><td>${fecha(r.fecha)}</td><td>${esc(r.modo)}</td><td>${esc(r.origen||"")}</td>
      <td>${r.resultado==="ok"?`<span class="chip pos">ok</span>`:`<span class="chip neg">${esc(r.resultado)}</span>`}${r.cortada?`<span class="chip warn">IA cortada</span>`:""}</td>
      <td class="n">${miles(r.llamadas)}</td><td class="n">${miles(r.tokens_in)}</td><td class="n">${miles(r.tokens_out)}</td><td class="n"><b>${usd(r.costo)}</b></td>
      <td style="white-space:normal;min-width:200px;font-size:12px" class="mut">${r.run?`<a href="${esc(r.run)}" target="_blank" rel="noopener">ver ejecución</a> · `:""}${esc(r.nota||r.fuente||"")}</td></tr>`).join("")}</tbody></table></div>
    <p class="mut" style="font-size:12px">Costo estimado con los precios de lista de cada modelo (config.yaml → ia.precios). El saldo exacto está en console.anthropic.com → Billing.</p></div>`;
  el.innerHTML=h;
}

function renderComo(){
  const m=(S?.criterio?.metricas)||[];
  const tabla=b=>m.filter(x=>x.bloque===b).map(x=>`<tr><td>${esc(x.nombre)}</td><td>${x.mayor_es_mejor?"Más alto":"Más bajo"}</td><td>${x.relativa_sector?"Dentro del sector":"Contra las 200"}</td><td class="n">${x.peso}</td></tr>`).join("");
  $("#t-como").innerHTML=`<div class="panel"><h2>Ciclo del agente</h2><ul>
   <li><b>Mensual (día 1):</b> toma las 200 empresas de mayor capitalización, calcula un score de calidad + valor, elige las 50 mejores y Claude escribe una tesis para cada una.</li>
   <li><b>Semanal (domingo):</b> elige 20 de esas 50: hasta 5 en <i>seguimiento</i> (las que la semana anterior estaban para entrar) y el resto por <i>rotación</i> (las que hace más tiempo que no se analizan, primero las de mejor score). Hace el análisis técnico y Claude cruza la tesis con el precio: entrar ahora, de a poco, esperar o evitar.</li></ul>
   <p class="mut">Score = ${S?Math.round(S.criterio.peso_calidad*100):55}% calidad + ${S?Math.round(S.criterio.peso_valor*100):45}% valor. Cada métrica se convierte en percentil (0 a 100) y se promedia por peso.</p></div>
   <div class="two"><div class="panel"><h2>Calidad</h2><table><thead><tr><th>Métrica</th><th>Mejor</th><th>Comparación</th><th class="n">Peso</th></tr></thead><tbody>${tabla("calidad")}</tbody></table></div>
   <div class="panel"><h2>Valor</h2><table><thead><tr><th>Métrica</th><th>Mejor</th><th>Comparación</th><th class="n">Peso</th></tr></thead><tbody>${tabla("valor")}</tbody></table></div></div>`;
}

(async()=>{
  [U,S,D,R,H,C]=await Promise.all([load("universo.json"),load("mensual.json"),load("semanal.json"),load("rotacion.json"),load("historial.json"),load("costos.json")]);
  SER=(await load("series.json"))?.series||{};
  $("#meta").textContent=`Semanal: ${fecha(D?.actualizado)} · Mensual: ${fecha(S?.actualizado)}`;
  renderHoy();renderSemana();renderUniverso();renderHistorial();renderCostos();renderComo();
})();
</script>
