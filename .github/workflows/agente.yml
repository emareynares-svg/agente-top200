name: Agente Top 200

on:
  schedule:
    - cron: "0 12 1 * *"      # MENSUAL: día 1 de cada mes, 09:00 (Argentina)
    - cron: "0 13 * * 0"      # SEMANAL: domingos, 10:00 (Argentina), con el cierre del viernes
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué análisis correr"
        type: choice
        options: [semanal, mensual, todo]
        default: todo

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agente-top200
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Elegir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODO="${{ inputs.modo }}"
          else
            case "${{ github.event.schedule }}" in
              "0 12 1 * *")    MODO=mensual ;;
              *)               MODO=semanal ;;
            esac
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO"

      - name: Correr agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agente ${{ steps.modo.outputs.modo }}

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "agente-top200[bot]"
          git config user.email "agente-top200@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos ${{ steps.modo.outputs.modo }} $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      # Publica el dashboard directamente desde este workflow (Settings → Pages → Source: GitHub Actions)
      - name: Preparar dashboard
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publicar dashboard
        id: publicar
        if: always()
        uses: actions/deploy-pages@v4
