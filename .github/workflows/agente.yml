name: Agente Top 200

on:
  schedule:
    - cron: "0 22 1 * *"      # MENSUAL: día 1 de cada mes, 19:00 (Argentina)
    - cron: "0 13 * * 0"      # SEMANAL: domingos, 10:00 (Argentina)
    - cron: "30 21 * * 1-5"   # DIARIO: lunes a viernes, 18:30 (Argentina), tras el cierre de NY
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué análisis correr"
        type: choice
        options: [diario, semanal, mensual, todo]
        default: todo

permissions:
  contents: write

concurrency:
  group: agente-top200
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Elegir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODO="${{ inputs.modo }}"
          else
            case "${{ github.event.schedule }}" in
              "0 22 1 * *")    MODO=mensual ;;
              "0 13 * * 0")    MODO=semanal ;;
              *)               MODO=diario ;;
            esac
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO"

      - name: Correr agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agente ${{ steps.modo.outputs.modo }}

      - name: Guardar resultados
        run: |
          git config user.name "agente-top200[bot]"
          git config user.email "agente-top200@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos ${{ steps.modo.outputs.modo }} $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
