# Configuración del Agente Top 200
# Podés editar estos valores directamente desde GitHub (botón del lápiz).

universo:
  cantidad: 200              # empresas por capitalización (mensual)
  # Agregar o quitar tickers manualmente (formato Yahoo Finance)
  excluir: []                # ej: ["2222.SR"]
  incluir_extra: []          # ej: ["CAT"]

mensual:
  cantidad: 50               # empresas con análisis fundamental y tesis (1 vez por mes)
  peso_calidad: 0.55         # calidad + valor deben sumar 1
  peso_valor: 0.45
  cobertura_minima: 0.5      # % mínimo de métricas disponibles para puntuar

semanal:
  cantidad: 20               # empresas con análisis técnico + momento de entrada (1 vez por semana)
  seguimiento_max: 5         # lugares reservados para repetir las que la semana anterior dieron "zona de compra"
  solo_operables: true       # solo las que cotizan en EE.UU. (acciones o ADR, comprables desde Hapi)

costos:
  # Cada vez que cargues crédito en console.anthropic.com, agregá una línea acá.
  # El dashboard (pestaña Costos) usa esto para estimar tu saldo.
  cargas:
    - {fecha: "2026-11-10", monto: 5}
    - {fecha: "2026-11-10", monto: 5}
  alerta_saldo: 1.5          # avisar en el dashboard si el saldo estimado baja de este monto (US$)

historial:
  referencia: "VOO"          # índice contra el que se compara cada análisis (tu núcleo)
  dias_minimos: 7            # días mínimos desde el análisis para contarlo en "¿funcionan las señales?"

ia:
  activada: true
  modelo: "claude-sonnet-5-5"        # tesis mensuales (50 llamadas por mes)
  modelo_semanal: "claude-sonnet-5-5" # momento de entrada semanal (1 llamada por semana)
  esfuerzo: "low"                    # low | medium | high: más alto = más razonamiento y más costo
  pensamiento: "between_tools"       # sin razonamiento previo (Sonnet 5.5). Para Haiku: "disabled"
  max_tokens_tesis: 4000
  max_tokens_semanal: 10000
  # Precios en US$ por millón de tokens [entrada, salida], solo para estimar el costo de cada ejecución.
  # Si cambiás de modelo, agregá acá su precio (ver platform.claude.com/docs → Pricing).
  precios:
    claude-sonnet-5-5: [2, 10]
  hilos: 4                           # llamadas en paralelo
  max_noticias: 6                    # titulares recientes por empresa

# Reglas personales (se le pasan a la IA como contexto)
perfil_inversor: >
  Inversora de largo plazo (horizonte ~8 años), perfil agresivo, invierte en dólares
  desde Argentina vía Hapi. Núcleo en índices (VOO/VXUS) y un satélite de ~13% en
  acciones individuales de calidad/valor, sin apalancamiento, máximo 4-5% por posición.
  Busca negocios sólidos a precio razonable para mantener años, no trading.
